{% extends 'index.html' %}
{% block title %} Payment {% endblock title %}
{% block body %}
<div class="container my-5" style="max-width: 500px;">
  <div class="card shadow-sm">
    <div class="card-body text-center">
      <h3 class="card-title mb-3">Simulated Payment Gateway</h3>
      <p class="text-muted">This is a mock payment screen for local demo purposes — no real transaction occurs.</p>

      <hr>
      <p class="mb-1">Order ID: <strong>{{ order.order_id }}</strong></p>
      <p class="mb-3">Amount: <strong>₹{{ amount }}</strong></p>
      <hr>

      <form method="post" action="{% url 'MockPaymentProcess' %}" class="d-grid gap-2">
        {% csrf_token %}
        <button type="submit" name="outcome" value="success" class="btn btn-success">Simulate Successful Payment</button>
        <button type="submit" name="outcome" value="failure" class="btn btn-outline-danger">Simulate Failed Payment</button>
      </form>
    </div>
  </div>
</div>
{% endblock body %}
